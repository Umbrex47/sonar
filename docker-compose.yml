services:
  sonar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonar_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./drafts:/app/drafts
      - ./out:/app/out
      - ./.env:/app/.env:ro
      - ./frontend/out:/app/frontend/out
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/reports"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:alpine
    container_name: sonar_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sonar

volumes:
  caddy_data:
  caddy_config:
